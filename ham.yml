title: "LineageOS 23.2 rhode (Tomoms 16.2 + KernelSU-Next + GApps w obrazie)"
version: "0.1.14"

# Serwer: HAM tworzy CCX33 (8 vCPU / 32 GB) + wolumen 400 GB na /ham-build, Ubuntu 24.04,
# ccache 50 GB, repo i platform-tools zainstalowane. Katalog przepisu jest w /ham-recipe.
# Uruchamiać (bezobsługowo): ~/bin/rhode/ham get MikolajQ@gh/rhode-los23.2 -t -b -n -a ~/.ham-answers-rhode.json -e ~/bin/rhode/ham-build
# HAM wpisuje linie do pty — każde interaktywne pytanie (np. repo init o kolory) zjada następną linię przepisu.

args:
  - id: gh_token
    prompt: "GitHub token z prawem repo (release w MikolajQ/rhode_releases)"
    type: secret
    required: true
  - id: gapps_extras_zip
    prompt: "Zip z product/priv-app/{GmsSupervision,Gearhead} + product/etc/permissions (patrz README)"
    type: file
    required: true
  - id: keys_zip
    prompt: "Klucze podpisu: ~/.android-certs-rhode.zip (pk8 + pem); puste = test-keys"
    type: file

build:
  - name: "Python domyślny"
    run: apt-get install -y -qq python-is-python3 gh git-lfs && git lfs install --skip-repo

  - name: "repo init + local manifest"
    run: |
      cd /ham-build
      git config --global color.ui false
      repo init -u https://github.com/tomoms/android -b 16.2 --git-lfs --depth=1 --no-clone-bundle < /dev/null
      mkdir -p .repo/local_manifests
      cp /ham-recipe/rhode.xml .repo/local_manifests/rhode.xml

  - name: "repo sync"
    run: |
      cd /ham-build
      for i in 1 2 3 4 5; do repo sync -c -j8 --no-clone-bundle --no-tags --optimized-fetch --force-sync && break; echo "repo sync: próba $i nieudana (limit android.googlesource.com?), czekam 3 min"; sleep 180; done
      repo sync -c -j2 --no-clone-bundle --no-tags --force-sync
      test -f external/chromium-webview/Android.bp   # linkfile z prebuiltu LOS (moduł "webview") ma istnieć
      test -f vendor/gapps/arm64/arm64-vendor.mk

  - name: "Patche (vendor/gapps: cięcie pakietów; vendor/lineage: bez prywatnych Trichrome*)"
    run: /ham-recipe/scripts/apply-patches.sh /ham-build

  - name: "hosts do obrazu (adult + social + komunikatory, bez WhatsApp/Signal)"
    run: /ham-recipe/scripts/fetch-hosts.sh /ham-build

  - name: "Repozytoria F-Droid (XML) w miejsce listy Tomoms w vendor/lineage"
    run: |
      cd /ham-build
      test -f vendor/lineage/prebuilt/common/etc/additional_fdroid_repos.xml
      cp vendor/extra/fdroid/additional_repos.xml vendor/lineage/prebuilt/common/etc/additional_fdroid_repos.xml
      grep -c izzysoft vendor/lineage/prebuilt/common/etc/additional_fdroid_repos.xml

  - name: "Identyfikator builda: miq zamiast Tom (TARGET_UNOFFICIAL_BUILD_ID w drzewie urządzenia Tomoms)"
    run: |
      cd /ham-build
      grep -q '^TARGET_UNOFFICIAL_BUILD_ID := Tom$' device/motorola/rhode/lineage_rhode.mk
      sed -i 's/^TARGET_UNOFFICIAL_BUILD_ID := Tom$/TARGET_UNOFFICIAL_BUILD_ID := miq/' device/motorola/rhode/lineage_rhode.mk
      grep -q '^TARGET_UNOFFICIAL_BUILD_ID := miq$' device/motorola/rhode/lineage_rhode.mk

  - name: "GApps extras (GmsSupervision, Gearhead)"
    run: /ham-recipe/scripts/gapps-extras.sh /ham-build "$GAPPS_EXTRAS_ZIP"

  - name: "Klucze podpisu (do /root/.android-certs; podpisywanie po buildzie, jak w wiki LineageOS)"
    run: |
      if [ -n "${KEYS_ZIP:-}" ] && [ -s "$KEYS_ZIP" ]; then
        rm -rf /root/.android-certs && mkdir -p /root/.android-certs && chmod 700 /root/.android-certs
        unzip -o -q "$KEYS_ZIP" -d /root/.android-certs
        test -s /root/.android-certs/releasekey.pk8
      fi

  - name: "Weryfikacja allowlist priv-app"
    run: python3 /ham-recipe/scripts/check-privapp.py /ham-build vendor/gapps/common/proprietary vendor/gapps/arm64/proprietary vendor/gapps-extras

  - name: "Swap 48 GB na wolumenie (soong_build bierze ~30 GB RAM przy analizie 993 projektów; CCX33 ma 32 GB)"
    run: |
      if ! swapon --show | grep -q /ham-build/swapfile; then
        fallocate -l 48G /ham-build/swapfile && chmod 600 /ham-build/swapfile && mkswap -q /ham-build/swapfile && swapon /ham-build/swapfile
      fi
      sysctl -q vm.swappiness=20
      free -g

  - name: "Build"
    run: |
      cd /ham-build
      export TMPDIR=/ham-build/tmp && mkdir -p "$TMPDIR"
      export WITH_GMS=true USE_CCACHE=1 CCACHE_EXEC=/usr/bin/ccache
      # dex2oatd (ART debug, domyslny dla dex_bootjars: "help find bugs") SIGSEGV deterministycznie
      # w RegTypeCache::FromClass przy weryfikacji boot jarow na tym drzewie -> release'owy dex2oat
      export USE_DEX2OAT_DEBUG=false
      # bootstrap HAM czasem zostawia /root/.cache/ccache jako zwykły plik zamiast katalogu -> "ccache: error: Not a directory"
      [ -f /root/.cache/ccache ] && rm -f /root/.cache/ccache
      mkdir -p /root/.cache/ccache
      source build/envsetup.sh
      breakfast rhode
      if [ -s /root/.android-certs/releasekey.pk8 ]; then
        mka target-files-package otatools -j8
        /ham-recipe/scripts/sign.sh /ham-build /root/.android-certs
      else
        mka bacon -j8
      fi

post_build:
  - /ham-recipe/scripts/upload.sh /ham-build
